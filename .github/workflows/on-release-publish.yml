name: go:release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Deny by default; each job opts in to exactly what it needs.
permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update VERSION file
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |-
          printf '%s' "$REF_NAME" > VERSION
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          body: |-
            # [machine-controller-manager-provider-hcloud] ${{ github.ref_name }}

  on-publish:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update VERSION file
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |-
          printf '%s' "$REF_NAME" > VERSION
      # No QEMU: the Dockerfile cross-compiles on $BUILDPLATFORM.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Use the checked-out tree (with the rewritten VERSION file) as build
          # context instead of the action's default git context of the tag.
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/machine-controller-manager-provider-hcloud:latest
            ghcr.io/${{ github.repository_owner }}/machine-controller-manager-provider-hcloud:${{ github.ref_name }}
